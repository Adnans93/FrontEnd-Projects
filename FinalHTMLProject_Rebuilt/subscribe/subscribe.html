<!-- صفحة الاشتراك -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اشترك الآن - أكاديمية البرمجة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="subscribe-page">

    <header class="subscribe-header">
        <div class="subscribe-logo">
            <h1>اشترك في المنصة</h1>
        </div>
        <nav class="subscribe-nav">
            <a href="../index/index.html" class="button-link">الصفحة الرئيسية</a>
        </nav>
    </header>

    <main class="subscribe-container">
        <section class="subscribe-form-section">
            <h2>إنشاء حساب جديد</h2>
            <form class="subscribe-quick-form">
                
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" placeholder="مثال: أحمد علي">
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" placeholder="********">
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور:</label>
                    <input type="password" placeholder="********">
                </div>

                <button type="submit" class="subscribe-submit-btn">اشترك الآن</button>
            </form>
        </section>
    </main>

    <footer class="subscribe-footer">
        <p>© 2026 أكاديمية البرمجة - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
