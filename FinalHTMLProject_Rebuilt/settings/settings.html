<!-- إعدادات الحساب -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعدادات الحساب - أكاديمية البرمجة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">

    <header class="settings-header">
        <div class="settings-logo">
            <h1>إعدادات الحساب</h1>
        </div>
        <nav class="settings-nav">
            <a href="../index/index.html" class="button-link">الصفحة الرئيسية</a>
        </nav>
    </header>

    <main class="settings-container">
        <section class="settings-form-section">
            <h2>تفضيلات المستخدم</h2>
            <form class="settings-quick-form">
                
                <div class="form-group">
                    <label>اللغة المفضلة:</label>
                    <select class="settings-select">
                        <option>العربية</option>
                        <option>English</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <label>تفعيل الإشعارات:</label>
                    <label class="checkbox-label">
                        <input type="checkbox" checked> بريد إلكتروني
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox"> رسائل نصية
                    </label>
                </div>

                <div class="form-group radio-group">
                    <label>اختيار المظهر:</label>
                    <div class="radio-options">
                        <label class="radio-label">
                            <input type="radio" name="theme" checked> فاتح
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="theme"> داكن
                        </label>
                    </div>
                </div>

                <button type="submit" class="settings-submit-btn">حفظ الإعدادات</button>
            </form>
        </section>
    </main>

    <footer class="settings-footer">
        <p>© 2026 أكاديمية البرمجة - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
